<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Passaparola</title>
  <style>
    body {
      font-family: verdana;
      background-image: url('serati.png');
      background-position: center center;
      background-repeat: no-repeat;
    }
.circle-container {
  position: relative;
  width: 800px;
  height: 800px;
  margin: 20px auto;
}

.circle-container .circle {
  position: absolute;
  top: 50%; left: 50%;
  width: 75px;
  height: 75px;
  margin: calc( -100px / 2 );
  background: orange;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
  user-select: none;
  cursor: pointer;
}
.circle-container .circle.green {
  background: green;
}
.circle-container .circle.red {
  background: red;
}

audio {
  position: absolute;
  top: 30px;
  right: 10px;
}
  </style>

</head>
<body>

<div id="app">
  <h1>Passaparola tennistico</h1>
  <div class="circle-container">
    <div v-for="letter in alphabet" :key="letter" class="circle"
         @click="changeColor(letter)"
         :class="{'gray': circles[letter] === 'gray', 'green': circles[letter] === 'green', 'red': circles[letter] === 'red'}">
      <div>{{ letter }}</div>
    </div>
  </div>
</div>


<audio controls autoplay>
  <source src="Sigla.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
<script>
  new Vue({
    el: '#app',
    data: {
      alphabet: 'BCDEFGHILMNOPQRSTUVZA'.split(''),
      circles: {},
    },
    created() {
      this.alphabet.forEach(letter => {
        this.$set(this.circles, letter, 'orange');
      });
    },
    mounted() {
      document.querySelectorAll( '.circle-container' ).forEach( ( ciclegraph )=>{
        let circles = ciclegraph.querySelectorAll( '.circle' )
        let angle = 360-90, dangle = 360 / circles.length
        for( let i = 0; i < circles.length; ++i ){
          let circle = circles[i]
          angle += dangle
          circle.style.transform = `rotate(${angle}deg) translate(${ciclegraph.clientWidth / 2}px) rotate(-${angle}deg)`
        }
      })
    },
    methods: {
      changeColor(letter) {
        if (!this.timerRunning) {
          const currentColor = this.circles[letter];
          switch (currentColor) {
            case 'orange':
              this.$set(this.circles, letter, 'green');
              break;
            case 'green':
              this.$set(this.circles, letter, 'red');
              break;
            case 'red':
              this.$set(this.circles, letter, 'orange');
              break;
            default:
              this.$set(this.circles, letter, 'orange');
          }
        }
      }
    }
  });
</script>

</body>
</html>
